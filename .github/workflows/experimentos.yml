name: Experimentos de referencia (Partes 2, 4, 5 e 6)

# Disparo manual (aba Actions > "Experimentos de referencia" > Run workflow).
# Roda versoes curtas dos experimentos do enunciado e publica CSVs, metadata.json e
# graficos nos branches "ci-resultados-<grupo>" deste repositorio.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experimentos:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        grupo: [p2p4, p5reno, p5cubic, p5scalable, p6]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Mininet e dependencias
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mininet openvswitch-switch iperf3 \
               ethtool iputils-ping python3-pip
          sudo python3 -m pip install -q --break-system-packages numpy pandas matplotlib
          sudo systemctl start openvswitch-switch || sudo service openvswitch-switch start
          for m in sch_netem sch_red tcp_scalable; do
            sudo modprobe $m || { sudo apt-get install -y -q linux-modules-extra-$(uname -r) && sudo modprobe $m; }
          done

      - name: Rodar experimentos (${{ matrix.grupo }})
        working-directory: ig_starter
        run: ../ci/experimentos.sh ${{ matrix.grupo }}

      - name: Guardar dados como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dados-${{ matrix.grupo }}
          path: ig_starter/dados

      - name: Publicar no branch ci-resultados-${{ matrix.grupo }}
        if: always() && github.repository == 'danielsadoc/trabalho-redes-ig'
        working-directory: ig_starter
        run: |
          sudo chown -R "$(id -u):$(id -g)" dados
          cd dados
          git init -q -b ci-resultados-${{ matrix.grupo }}
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
              commit -q -m "Resultados do run $GITHUB_RUN_ID (${GITHUB_SHA::7}), grupo ${{ matrix.grupo }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
              ci-resultados-${{ matrix.grupo }}
